        <feFuncB type="table" tableValues="0.728 0.750 0.773 0.801 0.835 0.869 0.896 0.906 0.895 0.862 0.811 0.753 0.695 0.636 0.614 0.624 0.652 0.694 0.742 0.789 0.828 0.854 0.863 0.843 0.787 0.711 0.622 0.524 0.421 0.318 0.214 0.090 0.075 0.071 0.070 0.072 0.076 0.084 0.093 0.105 0.117 0.129 0.144 0.238 0.314 0.378 0.428 0.465"><animate attributeName="tableValues" dur="14s" repeatCount="indefinite" values="0.728 0.750 0.773 0.801 0.835 0.869 0.896 0.906 0.895 0.862 0.811 0.753 0.695 0.636 0.614 0.624 0.652 0.694 0.742 0.789 0.828 0.854 0.863 0.843 0.787 0.711 0.622 0.524 0.421 0.318 0.214 0.090 0.075 0.071 0.070 0.072 0.076 0.084 0.093 0.105 0.117 0.129 0.144 0.238 0.314 0.378 0.428 0.465;0.728 0.750 0.773 0.799 0.824 0.839 0.838 0.818 0.783 0.743 0.711 0.704 0.723 0.752 0.808 0.872 0.930 0.974 0.998 0.996 0.968 0.916 0.844 0.750 0.637 0.528 0.429 0.344 0.274 0.215 0.159 0.077 0.077 0.087 0.099 0.111 0.123 0.134 0.142 0.147 0.148 0.146 0.143 0.208 0.242 0.260 0.268 0.273;0.728 0.750 0.773 0.795 0.808 0.807 0.792 0.771 0.755 0.760 0.798 0.873 0.968 1.000 1.000 1.000 1.000 1.000 1.000 0.908 0.803 0.695 0.594 0.504 0.426 0.373 0.340 0.321 0.307 0.284 0.236 0.121 0.121 0.130 0.136 0.137 0.135 0.129 0.121 0.110 0.099 0.090 0.085 0.128 0.165 0.209 0.264 0.332;0.728 0.750 0.773 0.791 0.798 0.794 0.787 0.791 0.818 0.876 0.967 1.000 1.000 1.000 1.000 1.000 1.000 0.909 0.788 0.673 0.575 0.503 0.462 0.446 0.444 0.454 0.466 0.466 0.445 0.395 0.305 0.143 0.128 0.123 0.115 0.105 0.094 0.085 0.078 0.076 0.078 0.086 0.099 0.176 0.255 0.335 0.413 0.483;0.728 0.750 0.773 0.795 0.808 0.807 0.792 0.771 0.755 0.760 0.798 0.873 0.968 1.000 1.000 1.000 1.000 1.000 1.000 0.908 0.803 0.695 0.594 0.504 0.426 0.373 0.340 0.321 0.307 0.284 0.236 0.121 0.121 0.130 0.136 0.137 0.135 0.129 0.121 0.110 0.099 0.090 0.085 0.128 0.165 0.209 0.264 0.332;0.728 0.750 0.773 0.799 0.824 0.839 0.838 0.818 0.783 0.743 0.711 0.704 0.723 0.752 0.808 0.872 0.930 0.974 0.998 0.996 0.968 0.916 0.844 0.750 0.63
      <feFlood flood-color="#ff8080" x="-397" width="1306" height="78.3059" y="-180.706" result="band0">
        <animate attributeName="y" values="-180.706;-180.706;632.471" keyTimes="0;0.62;1" dur="9s" repeatCount="indefinite"/>
      </feFlood>
      <feGaussianBlur in="band0" stdDeviation="0 27.1059" result="band1"/>
      <feMerge result="bandmap"><feMergeNode in="mid"/><feMergeNode in="band1"/></feMerge>
      <feDisplacementMap in="col" in2="bandmap" scale="36.1412" xChannelSelector="R" yChannelSelector="G" result="tracked"/>

      <!-- VHS lines: a row every few px, its threads cut at random -->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <title>A drop of glass with the whole gradient in it</title>
  <defs>
    <!-- across the drop the palette runs end to end; it turns slowly -->
    <linearGradient id="t" x1=".1" y1="0" x2=".45" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#000"/><stop offset="1" stop-color="#fff"/>
      <animateTransform attributeName="gradientTransform" type="rotate" values="0 .5 .5;360 .5 .5" dur="40s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="shade" cx=".5" cy=".5" r=".5">
      <stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset=".93" stop-color="#000" stop-opacity=".45"/><stop offset="1" stop-color="#000" stop-opacity=".7"/>
    </radialGradient>
    <radialGradient id="film" cx=".5" cy=".5" r=".5">
      <stop offset=".8" stop-color="#1199fb" stop-opacity="0"/><stop offset=".96" stop-color="#1199fb" stop-opacity=".3"/><stop offset="1" stop-color="#fff" stop-opacity=".25"/>
      <animate attributeName="r" values=".5;.47;.5" dur="7s" repeatCount="indefinite"/>
    </radialGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset=".3" stop-color="#8334f3" stop-opacity=".2"/><stop offset=".6" stop-color="#8334f3" stop-opacity=".04"/><stop offset="1" stop-color="#8334f3" stop-opacity="0"/>
    </radialGradient>
    <filter id="marble" filterUnits="userSpaceOnUse" x="-150" y="-150" width="600" height="600" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.0133333 0.0133333" numOctaves="2" seed="11" stitchTiles="stitch" x="0" y="0" width="300" height="300" result="swt"/>
    <feTile in="swt" x="-150" y="-150" width="600" height="600" result="swr"/>
    <feOffset in="swr" result="sw">
      <animate attributeName="dx" from="0" to="300" dur="23s" repeatCount="indefinite"/>
      <animate attributeName="dy" from="0" to="300" dur="23s" repeatCount="indefinite"/>
    </feOffset>
      <!-- the noise drags the gradient into swirls, then it goes through the palette -->
      <feDisplacementMap in="SourceGraphic" in2="sw" scale="126" xChannelSelector="R" yChannelSelector="G" result="grey0"/>
      <!-- pulled apart: the low half sinks to black, the high half runs hot -->
      <feComponentTransfer in="grey0" result="grey"><feFuncR type="linear" slope="1.8" intercept="-0.75"/><feFuncG type="linear" slope="1.8" intercept="-0.75"/><feFuncB type="linear" slope="1.8" intercept="-0.75"/></feComponentTransfer>

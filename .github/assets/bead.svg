        <feFuncB type="table" tableValues="0.000 0.000 0.004 0.012 0.030 0.057 0.087 0.116 0.143 0.184 0.217 0.242 0.263 0.289 0.329 0.390 0.470 0.568 0.662 0.767 0.877 0.985 1.000 1.000 1.000 1.000 1.000 1.000 0.892 0.770 0.656 0.554 0.449 0.358 0.282 0.207 0.095 0.077 0.088 0.100 0.113 0.126 0.139 0.217 0.341 0.441 0.522 0.584"><animate attributeName="tableValues" dur="14s" repeatCount="indefinite" values="0.000 0.000 0.004 0.012 0.030 0.057 0.087 0.116 0.143 0.184 0.217 0.242 0.263 0.289 0.329 0.390 0.470 0.568 0.662 0.767 0.877 0.985 1.000 1.000 1.000 1.000 1.000 1.000 0.892 0.770 0.656 0.554 0.449 0.358 0.282 0.207 0.095 0.077 0.088 0.100 0.113 0.126 0.139 0.217 0.341 0.441 0.522 0.584;0.000 0.000 0.004 0.012 0.030 0.055 0.081 0.104 0.125 0.159 0.190 0.226 0.274 0.341 0.433 0.545 0.670 0.797 0.890 0.968 1.000 1.000 1.000 1.000 0.992 0.913 0.779 0.666 0.580 0.521 0.488 0.478 0.460 0.437 0.397 0.322 0.154 0.124 0.134 0.140 0.143 0.142 0.138 0.190 0.263 0.303 0.326 0.343;0.000 0.000 0.004 0.012 0.029 0.053 0.077 0.098 0.121 0.162 0.213 0.280 0.366 0.471 0.585 0.697 0.799 0.875 0.892 0.883 0.850 0.801 0.746 0.696 0.664 0.644 0.618 0.623 0.650 0.688 0.725 0.750 0.720 0.651 0.544 0.397 0.169 0.120 0.113 0.105 0.096 0.088 0.082 0.117 0.179 0.243 0.321 0.417;0.000 0.000 0.004 0.012 0.029 0.052 0.076 0.101 0.131 0.187 0.259 0.346 0.445 0.545 0.633 0.698 0.738 0.744 0.703 0.654 0.609 0.581 0.580 0.616 0.691 0.785 0.846 0.904 0.944 0.956 0.935 0.881 0.762 0.616 0.461 0.302 0.117 0.079 0.074 0.072 0.076 0.083 0.096 0.161 0.276 0.391 0.503 0.606;0.000 0.000 0.004 0.012 0.029 0.053 0.077 0.098 0.121 0.162 0.213 0.280 0.366 0.471 0.585 0.697 0.799 0.875 0.892 0.883 0.850 0.801 0.746 0.696 0.664 0.644 0.618 0.623 0.650 0.688 0.725 0.750 0.720 0.651 0.544 0.397 0.169 0.120 0.113 0.105 0.096 0.088 0.082 0.117 0.179 0.243 0.321 0.417;0.000 0.000 0.004 0.012 0.030 0.055 0.081 0.104 0.125 0.159 0.190 0.226 0.274 0.341 0.433 0.545 0.670 0.797 0.890 0.968 1.000 1.000 1.000 1.000 0.99
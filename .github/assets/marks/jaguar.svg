      <feOffset in="g0" result="g1">
        <animate attributeName="dx" values="0;51.2;-27.1059;75.2941;-60.2353;21.0824;93.3647;-75.2941" dur="0.667s" calcMode="discrete" repeatCount="indefinite"/>
        <animate attributeName="dy" values="0;18.0706;39.1529;-21.0824;-42.1647;69.2706;33.1294;9.03529" dur="0.667s" calcMode="discrete" repeatCount="indefinite"/>
